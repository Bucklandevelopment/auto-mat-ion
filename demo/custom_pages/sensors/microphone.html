<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microphone Sensor Test | auto-mat-ion</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface-2: #252540;
      --primary: #00d4aa;
      --secondary: #7c3aed;
      --text: #e4e4e7;
      --text-dim: #71717a;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--surface-2);
      margin-bottom: 24px;
    }
    .back-link { color: var(--primary); text-decoration: none; font-size: 1.5rem; }
    h1 { font-size: 1.75rem; }

    .visualizer-container {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    #waveform {
      width: 100%;
      height: 150px;
      background: var(--bg);
      border-radius: 8px;
    }
    .level-meter {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
    }
    .level-bar-container {
      flex: 1;
      height: 24px;
      background: var(--surface-2);
      border-radius: 12px;
      overflow: hidden;
    }
    .level-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--success), var(--warning), var(--error));
      width: 0%;
      transition: width 0.1s;
    }
    .level-value {
      font-family: monospace;
      font-size: 1.25rem;
      color: var(--primary);
      min-width: 80px;
      text-align: right;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .control-group {
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
    }
    .control-group h3 {
      font-size: 0.875rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    select, button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--surface-2);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    select:hover, button:hover { border-color: var(--primary); }
    button.primary {
      background: var(--primary);
      color: var(--bg);
      font-weight: 600;
      border: none;
    }
    button.secondary { background: var(--secondary); color: white; border: none; }
    button.recording { background: var(--error); animation: pulse 1s infinite; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .button-row { display: flex; gap: 12px; margin-top: 12px; }
    .button-row button { flex: 1; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .constraints-panel {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .constraint-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .constraint-row label { flex: 1; font-size: 0.875rem; }
    .constraint-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
    }
    .constraint-row select { flex: 2; }

    .stats-panel {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
    }
    .stat-item {
      text-align: center;
      padding: 12px;
      background: var(--surface-2);
      border-radius: 8px;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--primary);
      font-family: monospace;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .log-panel {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
    }
    .log-panel h3 { margin-bottom: 12px; }
    #logOutput {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      line-height: 1.6;
    }
    .log-entry { padding: 2px 0; }
    .log-entry.info { color: var(--primary); }
    .log-entry.success { color: var(--success); }
    .log-entry.warning { color: var(--warning); }
    .log-entry.error { color: var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../index.html" class="back-link">←</a>
      <h1>🎤 Microphone Sensor Test</h1>
    </header>

    <div class="visualizer-container">
      <canvas id="waveform"></canvas>
      <div class="level-meter">
        <span>Volume:</span>
        <div class="level-bar-container">
          <div class="level-bar" id="levelBar"></div>
        </div>
        <span class="level-value" id="levelValue">0 dB</span>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <h3>Microphone Selection</h3>
        <select id="micSelect">
          <option value="">Select microphone...</option>
        </select>
        <div class="button-row">
          <button id="startBtn" class="primary">Start Mic</button>
          <button id="stopBtn" disabled>Stop</button>
        </div>
      </div>

      <div class="control-group">
        <h3>Sample Rate</h3>
        <select id="sampleRateSelect">
          <option value="">Default</option>
          <option value="8000">8 kHz</option>
          <option value="16000">16 kHz</option>
          <option value="22050">22.05 kHz</option>
          <option value="44100">44.1 kHz</option>
          <option value="48000">48 kHz</option>
          <option value="96000">96 kHz</option>
        </select>
      </div>

      <div class="control-group">
        <h3>Channels</h3>
        <select id="channelSelect">
          <option value="1">Mono</option>
          <option value="2">Stereo</option>
        </select>
      </div>

      <div class="control-group">
        <h3>Recording</h3>
        <button id="recordBtn" class="secondary" disabled>🔴 Record</button>
        <div class="button-row">
          <button id="playBtn" disabled>▶️ Play</button>
          <button id="downloadBtn" disabled>💾 Save</button>
        </div>
      </div>
    </div>

    <div class="constraints-panel">
      <h3>Audio Processing</h3>
      <div class="constraint-row">
        <label>Echo Cancellation</label>
        <input type="checkbox" id="echoCancellation" checked>
      </div>
      <div class="constraint-row">
        <label>Noise Suppression</label>
        <input type="checkbox" id="noiseSuppression" checked>
      </div>
      <div class="constraint-row">
        <label>Auto Gain Control</label>
        <input type="checkbox" id="autoGainControl" checked>
      </div>
    </div>

    <div class="stats-panel">
      <h3>📊 Audio Stats</h3>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="statSampleRate">-</div>
          <div class="stat-label">Sample Rate</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statChannels">-</div>
          <div class="stat-label">Channels</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statLatency">-</div>
          <div class="stat-label">Latency</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statPeak">-</div>
          <div class="stat-label">Peak Level</div>
        </div>
      </div>
    </div>

    <div class="log-panel">
      <h3>📝 Event Log</h3>
      <div id="logOutput"></div>
    </div>
  </div>

  <script>
    // State
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let animationId = null;

    const canvas = document.getElementById('waveform');
    const canvasCtx = canvas.getContext('2d');
    const logOutput = document.getElementById('logOutput');

    // Logging
    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toISOString().substr(11, 12)}] ${message}`;
      logOutput.appendChild(entry);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    // Enumerate devices
    async function enumerateDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter(d => d.kind === 'audioinput');
        const select = document.getElementById('micSelect');
        select.innerHTML = '<option value="">Select microphone...</option>';
        mics.forEach((device, i) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.textContent = device.label || `Microphone ${i + 1}`;
          select.appendChild(option);
        });
        log(`Found ${mics.length} microphone(s)`, 'success');
      } catch (err) {
        log(`Enumeration failed: ${err.message}`, 'error');
      }
    }

    // Get constraints
    function getConstraints() {
      const constraints = { audio: {} };
      const deviceId = document.getElementById('micSelect').value;
      const sampleRate = document.getElementById('sampleRateSelect').value;
      const channels = document.getElementById('channelSelect').value;

      if (deviceId) constraints.audio.deviceId = { exact: deviceId };
      if (sampleRate) constraints.audio.sampleRate = parseInt(sampleRate);
      if (channels) constraints.audio.channelCount = parseInt(channels);

      constraints.audio.echoCancellation = document.getElementById('echoCancellation').checked;
      constraints.audio.noiseSuppression = document.getElementById('noiseSuppression').checked;
      constraints.audio.autoGainControl = document.getElementById('autoGainControl').checked;

      return constraints;
    }

    // Start microphone
    async function startMicrophone() {
      try {
        const constraints = getConstraints();
        log(`Requesting: ${JSON.stringify(constraints.audio)}`, 'info');

        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;

        microphone = audioContext.createMediaStreamSource(mediaStream);
        microphone.connect(analyser);

        const track = mediaStream.getAudioTracks()[0];
        const settings = track.getSettings();

        document.getElementById('statSampleRate').textContent = `${(settings.sampleRate || audioContext.sampleRate) / 1000}k`;
        document.getElementById('statChannels').textContent = settings.channelCount || 1;
        document.getElementById('statLatency').textContent = `${(audioContext.baseLatency * 1000).toFixed(1)}ms`;

        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('recordBtn').disabled = false;

        log(`Microphone started: ${settings.sampleRate || audioContext.sampleRate}Hz`, 'success');

        visualize();
        enumerateDevices();

      } catch (err) {
        log(`Failed to start: ${err.message}`, 'error');
      }
    }

    // Stop microphone
    function stopMicrophone() {
      if (animationId) cancelAnimationFrame(animationId);
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioContext) audioContext.close();

      mediaStream = null;
      audioContext = null;
      analyser = null;
      microphone = null;

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('recordBtn').disabled = true;

      canvasCtx.fillStyle = '#0f0f1a';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      document.getElementById('levelBar').style.width = '0%';
      document.getElementById('levelValue').textContent = '0 dB';

      log('Microphone stopped', 'warning');
    }

    // Visualize
    function visualize() {
      if (!analyser) return;

      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        animationId = requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(dataArray);

        canvasCtx.fillStyle = '#0f0f1a';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = '#00d4aa';
        canvasCtx.beginPath();

        const sliceWidth = canvas.width / bufferLength;
        let x = 0;
        let peak = 0;

        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = v * canvas.height / 2;
          peak = Math.max(peak, Math.abs(v - 1));

          if (i === 0) canvasCtx.moveTo(x, y);
          else canvasCtx.lineTo(x, y);
          x += sliceWidth;
        }

        canvasCtx.lineTo(canvas.width, canvas.height / 2);
        canvasCtx.stroke();

        // Update level meter
        const level = Math.min(peak * 100, 100);
        document.getElementById('levelBar').style.width = `${level}%`;
        const db = peak > 0 ? 20 * Math.log10(peak) : -60;
        document.getElementById('levelValue').textContent = `${db.toFixed(1)} dB`;
        document.getElementById('statPeak').textContent = `${db.toFixed(1)}`;
      }

      draw();
    }

    // Recording
    document.getElementById('recordBtn').addEventListener('click', () => {
      const btn = document.getElementById('recordBtn');

      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream);
        mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
        mediaRecorder.onstop = () => {
          document.getElementById('playBtn').disabled = false;
          document.getElementById('downloadBtn').disabled = false;
          log(`Recording complete: ${recordedChunks.length} chunks`, 'success');
        };
        mediaRecorder.start();
        btn.textContent = '⏹️ Stop';
        btn.classList.add('recording');
        log('Recording started', 'info');
      } else {
        mediaRecorder.stop();
        btn.textContent = '🔴 Record';
        btn.classList.remove('recording');
      }
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.play();
      log('Playing recording', 'info');
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `recording_${Date.now()}.webm`;
      a.click();
      log('Recording saved', 'success');
    });

    // Event listeners
    document.getElementById('startBtn').addEventListener('click', startMicrophone);
    document.getElementById('stopBtn').addEventListener('click', stopMicrophone);
    navigator.mediaDevices.addEventListener('devicechange', enumerateDevices);

    // Automation API
    window.MicrophoneTest = {
      start: startMicrophone,
      stop: stopMicrophone,
      getLevel: () => document.getElementById('levelValue').textContent,
      isRecording: () => mediaRecorder?.state === 'recording',
    };

    // Init
    enumerateDevices();
    log('Microphone test page ready', 'success');
  </script>
</body>
</html>
