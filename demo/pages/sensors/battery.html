<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battery Status Test | auto-mat-ion</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface-2: #252540;
      --primary: #00d4aa;
      --secondary: #7c3aed;
      --text: #e4e4e7;
      --text-dim: #71717a;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--surface-2);
      margin-bottom: 24px;
    }
    .back-link { color: var(--primary); text-decoration: none; font-size: 1.5rem; }
    h1 { font-size: 1.75rem; }

    .battery-display {
      background: var(--surface);
      border-radius: 12px;
      padding: 40px;
      margin-bottom: 24px;
      text-align: center;
    }
    .battery-icon {
      position: relative;
      width: 200px;
      height: 100px;
      margin: 0 auto 30px;
    }
    .battery-body {
      width: 180px;
      height: 80px;
      border: 4px solid var(--text);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }
    .battery-cap {
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 30px;
      background: var(--text);
      border-radius: 0 4px 4px 0;
    }
    .battery-fill {
      height: 100%;
      transition: width 0.5s, background 0.5s;
    }
    .battery-fill.high { background: var(--success); }
    .battery-fill.medium { background: var(--warning); }
    .battery-fill.low { background: var(--error); }

    .charging-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      display: none;
    }
    .charging-indicator.visible {
      display: block;
      animation: flash 1s infinite;
    }
    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .battery-percentage {
      font-size: 4rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .battery-status {
      font-size: 1.25rem;
      color: var(--text-dim);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    .stat-icon { font-size: 2rem; margin-bottom: 12px; }
    .stat-value {
      font-size: 1.75rem;
      font-weight: bold;
      color: var(--primary);
      font-family: monospace;
    }
    .stat-label {
      font-size: 0.875rem;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .history-panel {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    #historyGraph {
      width: 100%;
      height: 150px;
      background: var(--bg);
      border-radius: 8px;
    }

    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    button {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: var(--surface-2);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: var(--primary); color: var(--bg); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--primary); color: var(--bg); }

    .log-panel { background: var(--surface); border-radius: 12px; padding: 20px; }
    #logOutput {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      max-height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .log-entry { padding: 2px 0; }
    .log-entry.info { color: var(--primary); }
    .log-entry.success { color: var(--success); }
    .log-entry.warning { color: var(--warning); }
    .log-entry.error { color: var(--error); }

    .not-supported {
      background: var(--error);
      color: white;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../index.html" class="back-link">←</a>
      <h1>🔋 Battery Status Test</h1>
    </header>

    <div class="not-supported" id="notSupported">
      ⚠️ Battery Status API is not supported in this browser.
    </div>

    <div class="battery-display">
      <div class="battery-icon">
        <div class="battery-body">
          <div class="battery-fill" id="batteryFill"></div>
          <span class="charging-indicator" id="chargingIndicator">⚡</span>
        </div>
        <div class="battery-cap"></div>
      </div>
      <div class="battery-percentage" id="batteryPercentage">--%</div>
      <div class="battery-status" id="batteryStatus">Checking...</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">⚡</div>
        <div class="stat-value" id="chargingStatus">--</div>
        <div class="stat-label">Charging Status</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏱️</div>
        <div class="stat-value" id="chargingTime">--</div>
        <div class="stat-label">Time to Full</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔌</div>
        <div class="stat-value" id="dischargingTime">--</div>
        <div class="stat-label">Time Remaining</div>
      </div>
    </div>

    <div class="history-panel">
      <h3>📊 Battery History</h3>
      <canvas id="historyGraph"></canvas>
    </div>

    <div class="controls">
      <button id="refreshBtn" class="primary">🔄 Refresh</button>
      <button id="exportBtn">📊 Export Data</button>
    </div>

    <div class="log-panel">
      <h3>📝 Event Log</h3>
      <div id="logOutput"></div>
    </div>
  </div>

  <script>
    // State
    let battery = null;
    let history = [];
    const maxHistory = 60;

    const canvas = document.getElementById('historyGraph');
    const ctx = canvas.getContext('2d');
    const logOutput = document.getElementById('logOutput');

    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toISOString().substr(11, 12)}] ${message}`;
      logOutput.appendChild(entry);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    function formatTime(seconds) {
      if (!seconds || !isFinite(seconds)) return '--';
      const hours = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      if (hours > 0) return `${hours}h ${mins}m`;
      return `${mins}m`;
    }

    function updateDisplay() {
      if (!battery) return;

      const level = Math.round(battery.level * 100);
      const charging = battery.charging;

      // Update percentage
      document.getElementById('batteryPercentage').textContent = `${level}%`;

      // Update fill bar
      const fill = document.getElementById('batteryFill');
      fill.style.width = `${level}%`;
      fill.className = 'battery-fill';
      if (level > 50) fill.classList.add('high');
      else if (level > 20) fill.classList.add('medium');
      else fill.classList.add('low');

      // Update charging indicator
      const indicator = document.getElementById('chargingIndicator');
      indicator.classList.toggle('visible', charging);

      // Update status text
      let status = charging ? 'Charging' : 'Discharging';
      if (level === 100 && charging) status = 'Fully Charged';
      if (level < 10 && !charging) status = 'Low Battery!';
      document.getElementById('batteryStatus').textContent = status;

      // Update stats
      document.getElementById('chargingStatus').textContent = charging ? 'Yes' : 'No';
      document.getElementById('chargingTime').textContent = formatTime(battery.chargingTime);
      document.getElementById('dischargingTime').textContent = formatTime(battery.dischargingTime);

      // Add to history
      history.push({
        timestamp: Date.now(),
        level: level,
        charging: charging
      });
      if (history.length > maxHistory) history.shift();

      drawGraph();
    }

    function drawGraph() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (history.length < 2) return;

      // Draw grid
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 10; i++) {
        const y = (i / 10) * canvas.height;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw line
      ctx.strokeStyle = '#00d4aa';
      ctx.lineWidth = 2;
      ctx.beginPath();

      history.forEach((point, i) => {
        const x = (i / (maxHistory - 1)) * canvas.width;
        const y = canvas.height - (point.level / 100) * canvas.height;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);

        // Draw charging indicator
        if (point.charging) {
          ctx.fillStyle = 'rgba(245, 158, 11, 0.3)';
          ctx.fillRect(x - 2, 0, 4, canvas.height);
        }
      });

      ctx.stroke();

      // Current level text
      const latest = history[history.length - 1];
      ctx.fillStyle = '#00d4aa';
      ctx.font = '12px monospace';
      ctx.fillText(`${latest.level}%`, canvas.width - 35, 15);
    }

    function exportData() {
      if (history.length === 0) {
        log('No data to export', 'warning');
        return;
      }

      let csv = 'timestamp,level,charging\n';
      history.forEach(h => {
        csv += `${h.timestamp},${h.level},${h.charging}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `battery_${Date.now()}.csv`;
      a.click();
      log(`Exported ${history.length} data points`, 'success');
    }

    async function init() {
      if (!('getBattery' in navigator)) {
        document.getElementById('notSupported').style.display = 'block';
        log('Battery Status API not supported', 'error');
        return;
      }

      try {
        battery = await navigator.getBattery();
        log('Battery API connected', 'success');

        // Initial update
        updateDisplay();

        // Event listeners
        battery.addEventListener('chargingchange', () => {
          log(`Charging: ${battery.charging}`, battery.charging ? 'success' : 'warning');
          updateDisplay();
        });

        battery.addEventListener('levelchange', () => {
          log(`Level: ${Math.round(battery.level * 100)}%`, 'info');
          updateDisplay();
        });

        battery.addEventListener('chargingtimechange', () => {
          updateDisplay();
        });

        battery.addEventListener('dischargingtimechange', () => {
          updateDisplay();
        });

        // Periodic update for graph
        setInterval(updateDisplay, 5000);

      } catch (err) {
        log(`Failed to get battery: ${err.message}`, 'error');
        document.getElementById('notSupported').style.display = 'block';
      }
    }

    // Event listeners
    document.getElementById('refreshBtn').addEventListener('click', updateDisplay);
    document.getElementById('exportBtn').addEventListener('click', exportData);

    // Automation API
    window.BatteryTest = {
      getLevel: () => battery ? Math.round(battery.level * 100) : null,
      isCharging: () => battery ? battery.charging : null,
      getChargingTime: () => battery ? battery.chargingTime : null,
      getDischargingTime: () => battery ? battery.dischargingTime : null,
      getHistory: () => history,
    };

    // Init
    init();
    log('Battery test page ready', 'success');
  </script>
</body>
</html>
